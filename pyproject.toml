[project]
name = "meta-rl"
version = "0.1.0"
requires-python = "==3.12.*"  # same python as the RunPod base image
dependencies = [
    "jax>=0.11.2",
    "jax[cuda12]>=0.11.2; sys_platform == 'linux'",  # CUDA wheels exist only for linux
    "flax>=0.12.10",
    "optax>=0.2.8",
    "tyro>=1.0.16",
    "craftax>=1.6.1",
    "orbax-checkpoint",
    "wandb>=0.30.0",
]
