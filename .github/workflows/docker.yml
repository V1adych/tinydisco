name: docker

on:
  push:
    branches: [main]
    paths: [Dockerfile, start.sh, pyproject.toml, uv.lock, .github/workflows/docker.yml]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            ghcr.io/v1adych/meta-rl:latest
            ghcr.io/v1adych/meta-rl:${{ github.sha }}
          # reuse unchanged layers from earlier runs, so a code-only change rebuilds in seconds
          cache-from: type=gha
          cache-to: type=gha,mode=max
